<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — SimSMS Virtual</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand" style="margin-bottom:24px;"><span class="brand-mark">SS</span> SimSMS Virtual</div>
    <h1>Criar sua conta</h1>
    <p class="sub">Leva menos de um minuto. Sem cartão de crédito pra começar.</p>
    <div class="form-msg" id="msg"></div>
    <form id="form-cadastro">
      <div class="field">
        <label for="nome">Nome</label>
        <input type="text" id="nome" required autocomplete="name">
      </div>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required minlength="6" autocomplete="new-password">
      </div>
      <button class="btn btn-teal btn-block" type="submit">Criar conta</button>
    </form>
    <div class="auth-foot">Já tem conta? <a href="/login.html">Entrar</a></div>
  </div>
</div>
<script src="/js/auth.js"></script>
<script>
(function () {
  document.querySelectorAll('input[type=password]').forEach(function (input) {
    var wrap = document.createElement('div');
    wrap.style.position = 'relative';
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);
    input.style.paddingRight = '72px';
    input.style.boxSizing = 'border-box';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Mostrar';
    btn.style.cssText = 'position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:12px;font-weight:600;color:var(--text-dim);font-family:inherit;';
    btn.addEventListener('click', function () {
      if (input.type === 'password') { input.type = 'text'; btn.textContent = 'Ocultar'; }
      else { input.type = 'password'; btn.textContent = 'Mostrar'; }
    });
    wrap.appendChild(btn);
  });
})();
</script>
</body>
</html>
